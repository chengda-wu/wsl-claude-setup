# SearXNG 配置示例（复制为 settings.yml 后使用）
use_default_settings: true
general:
  instance_name: "Local SearXNG"
search:
  formats:
    - html
    - json        # MCP 调用必须开启 JSON 输出
server:
  secret_key: "请改成你自己的随机字符串"
  bind_address: "0.0.0.0"
  port: 8080
# === 上游代理（让 SearXNG 容器经宿主机代理访问 Google/Bing/Baidu 等引擎）===
# 实测要点（见 docs/03-searxng.md「代理」与 docs/08-network.md）：
#   1. 必须用 SearXNG 的 outgoing.proxies，光给容器配 HTTP_PROXY 环境变量不够
#      （env 在场时引擎仍报 HTTP connection error）
#   2. enable_http2 必须关：经 HTTP 代理走 HTTPS+HTTP/2 握手会失败
#   3. request_timeout 默认 3s 太短，经代理经常超时，调到 10s
#   4. host.docker.internal 由 Docker Desktop 解析到宿主机（固定 192.168.65.254，
#      不随局域网 IP 变化）；代理客户端需开"允许局域网连接"
outgoing:
  request_timeout: 10.0
  enable_http2: false
  proxies:
    all://:
      - http://host.docker.internal:7897
engines:
  # === 通用 Web 搜索（实测稳定）===
  - name: bing
    disabled: false
  - name: baidu
    disabled: false
  - name: yandex
    disabled: false
  - name: mojeek
    disabled: false
  - name: sogou
    disabled: false
  - name: 360search
    disabled: false
  # === 通用 Web 搜索（反爬不可用，默认禁用）===
  # 以下引擎对自建 SearXNG 触发反爬，长期返回 0 结果：
  #   google cse  → "unusual traffic" 封禁（需配 CSE API key 才稳）
  #   brave       → 需配 API key（有免费额度）才稳
  #   duckduckgo  → CAPTCHA
  #   startpage   → CAPTCHA
  #   qwant       → CAPTCHA
  # 留着只会污染结果、刷 ERROR 日志。如需启用，配对应 API key 后改 disabled: false。
  - name: google cse
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
