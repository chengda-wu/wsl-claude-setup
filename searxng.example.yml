# SearXNG 配置示例（复制为 settings.yml 后使用）
use_default_settings: true
general:
  instance_name: "Local SearXNG"
search:
  formats:
    - html
    - json        # MCP 调用必须开启 JSON 输出
server:
  secret_key: "请改成你自己的随机字符串"
  bind_address: "0.0.0.0"
  port: 8080
engines:
  - name: google cse
    disabled: false
  - name: bing
    disabled: false
  - name: baidu
    disabled: false
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: startpage
    disabled: true
